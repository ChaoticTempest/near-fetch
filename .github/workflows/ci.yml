name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: just ci

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
      - name: Verify MSRV-compatible dependency resolution
        run: |
          set -euo pipefail
          # Cargo.lock is intentionally gitignored, so resolution could silently
          # drift to dependencies requiring a newer compiler. Resolve a fresh
          # lockfile with Rust 1.95's incompatible-rust-versions fallback so
          # version selection itself prefers MSRV-compatible releases.
          export CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback
          cargo +1.95 generate-lockfile
          cargo +1.95 metadata --format-version 1 > "$RUNNER_TEMP/msrv-metadata.json"
          python3 - <<'PY'
          import json
          import os

          MSRV = (1, 95, 0)

          def parse(version):
              parts = []
              for component in version.split(".")[:3]:
                  digits = ""
                  for character in component:
                      if not character.isdigit():
                          break
                      digits += character
                  parts.append(int(digits) if digits else 0)
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts)

          with open(os.path.join(os.environ["RUNNER_TEMP"], "msrv-metadata.json")) as f:
              metadata = json.load(f)
          offending = [
              f"{pkg['name']} {pkg['version']} (rust_version {pkg['rust_version']})"
              for pkg in metadata["packages"]
              if pkg.get("rust_version") and parse(pkg["rust_version"]) > MSRV
          ]
          if offending:
              print("::error::Resolved dependencies require a Rust version newer than 1.95:")
              for item in offending:
                  print(f"::error::  {item}")
              raise SystemExit(1)
          print("All resolved dependencies are compatible with Rust 1.95.")
          PY
          # Prove the freshly generated lockfile is usable with the MSRV toolchain.
          cargo +1.95 check --locked -p near-fetch
      - run: just check
      - run: just test

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2
      - run: just features

  release-bump:
    if: "github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'release: ')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out the release PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - uses: Swatinem/rust-cache@v2

      - name: Extract expected version from PR title
        run: |
          set -euo pipefail
          if [[ ! "$PR_TITLE" =~ ^release:\ ([0-9]+\.[0-9]+\.[0-9]+)(\ \(#[0-9]+\))?$ ]]; then
            echo "::error::Malformed release PR title '$PR_TITLE'. Expected exactly: release: X.Y.Z (optionally followed by ' (#N)')"
            exit 1
          fi
          EXPECTED="${BASH_REMATCH[1]}"
          echo "EXPECTED=$EXPECTED" >> "$GITHUB_ENV"
          echo "Expected version: $EXPECTED"

      - name: Read base version from Cargo.toml
        run: |
          set -euo pipefail
          BASE="$(python3 - <<'PY'
          import os
          import re
          import subprocess

          text = subprocess.check_output(
              ["git", "show", f'{os.environ["BASE_SHA"]}:near-fetch/Cargo.toml'],
              text=True,
          )
          try:
              import tomllib
          except ImportError:  # Python < 3.11
              tomllib = None
          if tomllib is not None:
              version = tomllib.loads(text)["package"]["version"]
          else:
              section = text.split("[package]", 1)[1].split("\n[", 1)[0]
              match = re.search(r'^version\s*=\s*"([^"]+)"', section, re.M)
              if not match:
                  raise SystemExit("error: could not read [package] version from base Cargo.toml")
              version = match.group(1)
          print(version)
          PY
          )"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "Base version: $BASE"

      - name: Require an unused version tag
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$EXPECTED" >/dev/null; then
            echo "::error::Tag '$EXPECTED' already exists; release PRs must use a new version."
            exit 1
          fi
          echo "No existing tag for $EXPECTED"

      - name: Verify the Cargo version was bumped
        run: just release-check "$EXPECTED" "$BASE"
